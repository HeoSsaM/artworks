<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERY || ARTWORKS</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="./js/login.js"></script>
</head>

<body>
    <header class="header">
        <nav class="container nav">
            <a href="index.html" class="logo">ART WORKS</a>
            <div class="gnb">
                <a href="index.html">HOME</a>
                <a href="gallery.html">갤러리</a>
                <a href="upload.html">작품등록</a>
                <a href="guide.html">이용안내</a>
                <span id="account-nav">
                    <a href="login.html">로그인</a>
                </span>
            </div>
        </nav>
    </header>

    <main class="container section">
        <div class="form-box">
            <p class="sub-title">ACCOUNT</p>
            <h1>로그인 / 회원가입</h1>
             <form action="" id="auth-form">
                <div class="radio-row">
                    <label>
                        <input 
                            type="radio" 
                            name="mode" 
                            value="login"
                            checked />
                        로그인
                    </label>
                    <label>
                        <input 
                            type="radio" 
                            name="mode" 
                            value="signup"
                        />
                        회원가입
                    </label>
                </div>

                <label for="eamil">이메일</label>
                <input type="email" id="email" required autocomplete="email">

                <label for="password">비밀번호</label>
                <input 
                    type="password" 
                    id="password" 
                    maxlength="6"
                    required
                    autocomplete="current-password" />
                <button type="submit">확인</button>

                <p id="message" aria-live="polite"></p>

             </form>
        </div>
    </main>
    
<body>    
</body>
</html>
