<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작품 상세 | ART WORKS</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="./js/detail.js"></script>
</head>

<body>
    <header class="header">
        <nav class="container nav">
            <a href="index.html" class="logo">ART WORKS</a>
            <div class="gnb">
                <a href="index.html">HOME</a>
                <a href="gallery.html">갤러리</a>
                <a href="upload.html">작품등록</a>
                <a href="guide.html">이용안내</a>
                <span id="account-nav">
                    <a href="login.html">로그인</a>
                </span>
            </div>
        </nav>
    </header>

    <main class="container section">
        <p class="sub-title">ARTWORK DETAIL</p>
        <p id="detail-message" class="intro" aria-live="polite">작품을 불러오는 중...</p>
        <article id="art-detail" class="detail-grid" hidden>
            <div>
                <img id="detail-image" class="detail-image" alt="" hidden>
                <div id="detail-placeholder" class="no-image detail-placeholder" hidden>ART WORKS</div>
            </div>
            <div>
                <p id="detail-category" class="muted"></p>
                <h1 id="detail-title"></h1>
                <p id="detail-artist"></p>
                <p id="detail-description" class="detail-description"></p>
                <div class="order-row">
                    <strong>구매 가격</strong>
                    <span id="detail-price"></span>
                </div>
                <div class="order-row">
                    <strong>월 대여 가격</strong>
                    <span id="detail-rental-price"></span>
                </div>
                <p><a class="btn" href="gallery.html">갤러리로 돌아가기</a></p>
            </div>
        </article>
    </main>

    <footer class="footer">
        <div class="container">
            ART WORKS &middot; javascript + supabase 포트폴리오 &middot; 실제 결제/예약 서비스가 아닙니다.
        </div>
    </footer>
</body>

</html>
